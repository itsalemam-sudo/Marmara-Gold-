<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A1832" />
    <meta
      name="description"
      content="Marmara Precious Metals Group — trading, refining partnerships, vaulting and settlement across gold, silver, platinum and palladium. Institutional clients across 180+ markets. Operating through Marmara Gold Trading LLC (Dubai, UAE)."
    />
    <meta property="og:title" content="Marmara Precious Metals Group" />
    <meta
      property="og:description"
      content="Your trusted partner in precious metals. Gold, silver, platinum, palladium — physical and settlement, worldwide."
    />
    <meta property="og:type" content="website" />

    <!-- Font loading — cut over from full-family sync fetch to an
         async, subset-friendly bootstrap. `preconnect` warms the TLS
         handshake to the CDN; the stylesheet is then loaded with
         `media="print" onload=…` so it doesn't block first paint.
         The <noscript> fallback keeps text styled for crawlers and
         JS-disabled clients. Tajawal + Amiri were dropped from the
         critical fetch — they were queued for the future Arabic
         locale which isn't shipping yet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>

    <title>Marmara Precious Metals Group — Institutional Bullion Trading</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
