# -----------------------------------------------------------------------
# Marmara Gold — HTTP-only nginx server block.
#
# Use this to bootstrap the site before TLS is in place. Once DNS is
# pointed at the server and `certbot --nginx -d marmaragold.ae -d
# www.marmaragold.ae --redirect` has run, certbot will rewrite this
# file with HTTPS + an auto-redirect. Or swap in deploy/nginx.conf
# manually.
# -----------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marmaragold.ae www.marmaragold.ae _;

    root /var/www/marmara-gold;
    index index.html;

    # Long cache for content-hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Short cache for HTML with SPA-style fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options   "DENY"    always;
    add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
