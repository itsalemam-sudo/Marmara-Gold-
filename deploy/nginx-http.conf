# -----------------------------------------------------------------------
# Marmara Gold — HTTP-only nginx server block.
#
# Use this to bootstrap the site before TLS is in place. Once DNS is
# pointed at the server and `certbot --nginx -d marmaragold.ae -d
# www.marmaragold.ae --redirect` has run, certbot will rewrite this
# file with HTTPS + an auto-redirect. Or swap in deploy/nginx.conf
# manually.
# -----------------------------------------------------------------------

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name marmaragold.ae www.marmaragold.ae _;

    root /var/www/marmara-gold;
    index index.html;

    # ---- maintenance mode ------------------------------------------------
    # Toggle with a flag file on disk — no nginx reload needed:
    #   turn ON  :  touch /var/www/marmara-gold/.maintenance
    #   turn OFF :  rm   /var/www/marmara-gold/.maintenance
    # When the flag exists, every request returns maintenance.html with a
    # 503 status (so crawlers, uptime monitors and health checks see the
    # right signal), except for the maintenance page itself and static
    # assets it needs (favicon, fonts).
    set $maintenance 0;
    if (-f $document_root/.maintenance) { set $maintenance 1; }
    if ($request_uri = /maintenance.html) { set $maintenance 0; }
    if ($request_uri ~* ^/favicon\.svg$) { set $maintenance 0; }
    if ($maintenance = 1) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Retry-After 3600 always;
    }
    # ---------------------------------------------------------------------

    # Long cache for content-hashed assets.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Short cache for HTML with SPA-style fallback.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options   "DENY"    always;
    add_header Referrer-Policy   "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
