# -----------------------------------------------------------------------
# Marmara Gold — sample nginx server block for the static build.
#
# Drop this into /etc/nginx/conf.d/marmaragold.conf (or include from your
# existing site file), point `root` at the unpacked dist/ folder, and
# reload nginx. TLS certs assumed to live at /etc/letsencrypt/… — swap
# for your paths if different.
# -----------------------------------------------------------------------

# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name marmaragold.ae www.marmaragold.ae;
    return 301 https://$host$request_uri;
}

# HTTPS site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name marmaragold.ae www.marmaragold.ae;

    # >>> Change these two paths to match your server.
    root /var/www/marmara-gold;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/marmaragold.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marmaragold.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- maintenance mode ------------------------------------------------
    # Toggle with a flag file on disk — no nginx reload needed:
    #   turn ON  :  touch /var/www/marmara-gold/.maintenance
    #   turn OFF :  rm   /var/www/marmara-gold/.maintenance
    # Serves maintenance.html with 503 for everything except the page
    # itself and the favicon.
    set $maintenance 0;
    if (-f $document_root/.maintenance) { set $maintenance 1; }
    if ($request_uri = /maintenance.html) { set $maintenance 0; }
    if ($request_uri ~* ^/favicon\.svg$) { set $maintenance 0; }
    if ($maintenance = 1) {
        return 503;
    }
    error_page 503 @maintenance;
    location @maintenance {
        rewrite ^ /maintenance.html break;
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header Retry-After 3600 always;
    }
    # ---------------------------------------------------------------------

    # Long cache for content-hashed assets, short cache for HTML.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # SPA-style fallback — every unmatched path returns index.html.
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # Gzip is on by default in most distros; brotli is even better if
    # you have the module.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Security headers — safe defaults for a static marketing site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
}
