<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f8fbff"/>
      <stop offset="35%" stop-color="#dee6f0"/>
      <stop offset="72%" stop-color="#7a8598"/>
      <stop offset="100%" stop-color="#3d4552"/>
    </linearGradient>
    <radialGradient id="seal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#dee6f0"/>
      <stop offset="100%" stop-color="#3d4552"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow"><stop offset="0%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="330" rx="110" ry="12" fill="url(#shadow)"/>

  <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#face)"/>
  <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#glare)"/>

  <circle cx="240" cy="82" r="28" fill="url(#seal)"/>
  <circle cx="240" cy="82" r="28" fill="none" stroke="#2b323d" stroke-width="1" opacity="0.5"/>
  <g fill="#2b323d" opacity="0.9" transform="translate(240 82)">
    <path d="M-13 10 L-13 -12 L-8 -12 L0 3 L8 -12 L13 -12 L13 10 L8 10 L8 -3 L1 10 L-1 10 L-8 -3 L-8 10 Z"/>
    <rect x="-13" y="12" width="26" height="1.6" rx="0.8"/>
  </g>

  <g font-family="Georgia, serif" fill="#2b323d" opacity="0.9">
    <text x="240" y="150" font-size="26" font-weight="700" text-anchor="middle">1000 g</text>
    <text x="240" y="176" font-size="11.5" font-weight="700" text-anchor="middle" letter-spacing="1.5">999.5 FINE PLATINUM</text>
  </g>

  <rect x="212" y="192" width="56" height="26" rx="3" fill="none" stroke="#2b323d" stroke-width="1.4" opacity="0.85"/>
  <text x="240" y="211" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#2b323d" text-anchor="middle" opacity="0.9">PT</text>

  <rect x="192" y="230" width="96" height="24" rx="3" fill="none" stroke="#2b323d" stroke-width="1.2" opacity="0.85"/>
  <text x="240" y="248" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#2b323d" text-anchor="middle" opacity="0.9" letter-spacing="2">MARMARA</text>

  <text x="240" y="282" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#2b323d" text-anchor="middle" opacity="0.75" letter-spacing="1.5">SN 2026-201</text>

  <!-- LPPM cartouche bottom-left -->
  <rect x="184" y="294" width="42" height="16" rx="2" fill="none" stroke="#2b323d" stroke-width="1" opacity="0.75"/>
  <text x="205" y="305" font-family="Georgia, serif" font-size="10" font-weight="700" fill="#2b323d" text-anchor="middle" opacity="0.8" letter-spacing="1.5">LPPM</text>
  <!-- Secondary hallmark -->
  <rect x="252" y="294" width="42" height="16" rx="2" fill="none" stroke="#2b323d" stroke-width="1" opacity="0.75"/>
  <circle cx="264" cy="302" r="4" fill="none" stroke="#2b323d" stroke-width="0.8" opacity="0.7"/>
  <text x="280" y="305" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#2b323d" text-anchor="middle" opacity="0.8">PGM</text>
</svg>
