<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#132244"/>
      <stop offset="100%" stop-color="#0a1832"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#fff5c9"/>
      <stop offset="30%" stop-color="#f0d67e"/>
      <stop offset="70%" stop-color="#c69a34"/>
      <stop offset="100%" stop-color="#8a6417"/>
    </linearGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow"><stop offset="0%" stop-color="#000" stop-opacity="0.3"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="330" rx="90" ry="10" fill="url(#shadow)"/>

  <rect x="170" y="60" width="140" height="240" rx="12" fill="#e8e4d8" opacity="0.6"/>
  <rect x="176" y="66" width="128" height="228" rx="8" fill="url(#card)"/>

  <rect x="188" y="78" width="104" height="204" rx="5" fill="none" stroke="#c6a15b" stroke-width="0.8" opacity="0.7"/>

  <!-- top M crown -->
  <g fill="#c6a15b" transform="translate(240 100)">
    <path d="M-11 8 L-11 -10 L-7 -10 L0 3 L7 -10 L11 -10 L11 8 L7 8 L7 -3 L1 8 L-1 8 L-7 -3 L-7 8 Z"/>
    <rect x="-11" y="10" width="22" height="1.5" rx="0.7"/>
  </g>

  <!-- bar body inside card -->
  <rect x="204" y="122" width="72" height="120" rx="3" fill="url(#bar)"/>
  <rect x="204" y="122" width="72" height="120" rx="3" fill="url(#glare)"/>

  <!-- struck M -->
  <g fill="#5a3f13" opacity="0.85" transform="translate(240 168)">
    <path d="M-11 10 L-11 -12 L-7 -12 L0 3 L7 -12 L11 -12 L11 10 L7 10 L7 -4 L1 10 L-1 10 L-7 -4 L-7 10 Z"/>
    <rect x="-11" y="12" width="22" height="1.8" rx="0.9"/>
  </g>
  <text x="240" y="203" font-family="Georgia, serif" font-size="8" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.85" letter-spacing="1.5">MARMARA</text>
  <text x="240" y="214" font-family="Georgia, serif" font-size="7" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.85" letter-spacing="1.5">GOLD</text>

  <!-- barcode -->
  <rect x="218" y="225" width="44" height="10" fill="#fff" opacity="0.6"/>

  <text x="240" y="266" font-family="Georgia, serif" font-size="10" font-weight="600" fill="#e8e0c7" text-anchor="middle" letter-spacing="1.5">50 g · 999.9</text>
  <text x="240" y="282" font-family="'Courier New', monospace" font-size="8" fill="#e8e0c7" text-anchor="middle" letter-spacing="1.5" opacity="0.85">SN 2026-030</text>
</svg>
