<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f8e59a"/>
      <stop offset="35%" stop-color="#e6c565"/>
      <stop offset="72%" stop-color="#b98d2a"/>
      <stop offset="100%" stop-color="#7a5a15"/>
    </linearGradient>
    <radialGradient id="indent" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#5a3f13"/>
      <stop offset="70%" stop-color="#8a6417"/>
      <stop offset="100%" stop-color="#d4a745"/>
    </radialGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="shadow">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="330" rx="105" ry="12" fill="url(#shadow)"/>

  <!-- pouch outer shape (rounded, wider than bar) -->
  <path d="M158 34 Q145 30 148 46 L148 315 Q148 328 165 328 L315 328 Q332 328 332 315 L332 46 Q335 30 322 34 Z"
        fill="#ffffff" fill-opacity="0.55" stroke="#b8b0a0" stroke-width="1.2" opacity="0.85"/>

  <!-- gold bar inside pouch -->
  <g>
    <rect x="176" y="60" width="128" height="240" rx="10" fill="url(#face)"/>
    <circle cx="240" cy="102" r="20" fill="url(#indent)"/>

    <g font-family="Georgia, serif" fill="#5a3f13" opacity="0.85">
      <text x="240" y="160" font-size="22" font-weight="700" text-anchor="middle">500 g</text>
      <text x="240" y="186" font-size="19" font-weight="700" text-anchor="middle">999.9</text>
    </g>
    <rect x="216" y="198" width="48" height="22" rx="3" fill="none" stroke="#5a3f13" stroke-width="1.2" opacity="0.85"/>
    <text x="240" y="214" font-family="Georgia, serif" font-size="14" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.9">AU</text>

    <rect x="196" y="230" width="88" height="22" rx="3" fill="none" stroke="#5a3f13" stroke-width="1.1" opacity="0.85"/>
    <text x="240" y="245" font-family="Georgia, serif" font-size="12" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.9" letter-spacing="2">MARMARA</text>

    <text x="240" y="278" font-family="'Courier New', monospace" font-size="11" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.75" letter-spacing="1.5">SN 2026-002</text>
  </g>

  <!-- pouch highlight glare overlay -->
  <path d="M158 34 Q145 30 148 46 L148 315 Q148 328 165 328 L315 328 Q332 328 332 315 L332 46 Q335 30 322 34 Z"
        fill="url(#pouch)"/>

  <!-- pouch top crimp/seal -->
  <path d="M150 30 L330 30 L326 46 L154 46 Z" fill="#f5f0e6" stroke="#b8b0a0" stroke-width="1"/>
  <g stroke="#a89e8a" stroke-width="0.6" opacity="0.75">
    <line x1="160" y1="34" x2="160" y2="42"/>
    <line x1="180" y1="34" x2="180" y2="42"/>
    <line x1="200" y1="34" x2="200" y2="42"/>
    <line x1="220" y1="34" x2="220" y2="42"/>
    <line x1="240" y1="34" x2="240" y2="42"/>
    <line x1="260" y1="34" x2="260" y2="42"/>
    <line x1="280" y1="34" x2="280" y2="42"/>
    <line x1="300" y1="34" x2="300" y2="42"/>
    <line x1="320" y1="34" x2="320" y2="42"/>
  </g>
</svg>
