<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <radialGradient id="face" cx="35%" cy="30%" r="80%">
      <stop offset="0%"  stop-color="#fff5c9"/>
      <stop offset="30%" stop-color="#f0d67e"/>
      <stop offset="70%" stop-color="#c69a34"/>
      <stop offset="100%" stop-color="#5a3f13"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e6c565"/>
      <stop offset="100%" stop-color="#5a3f13"/>
    </linearGradient>
    <radialGradient id="shadow"><stop offset="0%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="326" rx="120" ry="12" fill="url(#shadow)"/>

  <!-- rim (thicker for 3/4 view) -->
  <ellipse cx="240" cy="180" rx="135" ry="130" fill="url(#rim)"/>
  <!-- ridged edge -->
  <g stroke="#5a3f13" stroke-width="0.7" opacity="0.6">
    <line x1="105" y1="180" x2="112" y2="180"/>
    <line x1="368" y1="180" x2="375" y2="180"/>
    <line x1="240" y1="50" x2="240" y2="57"/>
    <line x1="240" y1="303" x2="240" y2="310"/>
  </g>

  <!-- coin face -->
  <ellipse cx="240" cy="180" rx="126" ry="122" fill="url(#face)"/>

  <!-- inner rim ring -->
  <ellipse cx="240" cy="180" rx="110" ry="106" fill="none" stroke="#5a3f13" stroke-width="1.2" opacity="0.5"/>
  <ellipse cx="240" cy="180" rx="104" ry="100" fill="none" stroke="#fff5c9" stroke-width="0.6" opacity="0.5"/>

  <!-- outer arc text -->
  <path id="arc-top" d="M 240 180 m -108 0 a 108 104 0 1 1 216 0" fill="none"/>
  <text font-family="Georgia, serif" font-size="11" font-weight="700" fill="#5a3f13" letter-spacing="2" opacity="0.85">
    <textPath href="#arc-top" startOffset="4%">MARMARA GOLD · 1 oz · 999.9 FINE GOLD</textPath>
  </text>

  <!-- heraldic eagle -->
  <g fill="#5a3f13" opacity="0.88" transform="translate(240 190)">
    <!-- crown -->
    <path d="M-14 -70 L-6 -66 L-6 -74 L-2 -66 L-2 -74 L2 -66 L2 -74 L6 -66 L6 -74 L14 -70 L14 -62 L-14 -62 Z"/>
    <!-- head -->
    <ellipse cx="0" cy="-52" rx="9" ry="10"/>
    <path d="M6 -58 L14 -54 L8 -50 Z"/>
    <!-- body core -->
    <path d="M-8 -42 L8 -42 L12 4 L4 34 L-4 34 L-12 4 Z"/>
    <!-- left wing -->
    <path d="M-8 -40 Q-48 -32 -60 -6 Q-58 20 -42 32 Q-30 24 -22 12 Q-20 0 -14 -14 Q-12 -30 -10 -40 Z"/>
    <!-- feather details left -->
    <g stroke="#c69a34" stroke-width="0.7" opacity="0.5" fill="none">
      <path d="M-30 -22 L-52 -18"/>
      <path d="M-32 -12 L-56 -6"/>
      <path d="M-34 -2 L-56 6"/>
      <path d="M-32 10 L-50 20"/>
    </g>
    <!-- right wing -->
    <path d="M8 -40 Q48 -32 60 -6 Q58 20 42 32 Q30 24 22 12 Q20 0 14 -14 Q12 -30 10 -40 Z"/>
    <g stroke="#c69a34" stroke-width="0.7" opacity="0.5" fill="none">
      <path d="M30 -22 L52 -18"/>
      <path d="M32 -12 L56 -6"/>
      <path d="M34 -2 L56 6"/>
      <path d="M32 10 L50 20"/>
    </g>
    <!-- shield on chest -->
    <path d="M-8 -20 L8 -20 L8 -2 L0 8 L-8 -2 Z" fill="#c69a34" stroke="#5a3f13" stroke-width="0.6"/>
    <path d="M-6 -18 L6 -18 M-6 -14 L6 -14 M-6 -10 L6 -10" stroke="#5a3f13" stroke-width="0.4" fill="none"/>
    <!-- sword -->
    <path d="M-32 8 L-14 -12 L-11 -9 L-29 11 Z"/>
    <!-- talons/legs -->
    <path d="M-6 34 L-6 44 M-2 34 L-2 44 M2 34 L2 44 M6 34 L6 44" stroke="#5a3f13" stroke-width="1.4"/>
    <!-- ribbon -->
    <path d="M-20 46 L-14 42 L20 42 L14 46 L20 50 L-14 50 Z" fill="#c69a34"/>
  </g>

  <!-- date bottom -->
  <text x="240" y="272" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.85">2026</text>
</svg>
