<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f6f8fb"/>
      <stop offset="35%" stop-color="#d5dae1"/>
      <stop offset="72%" stop-color="#8f97a3"/>
      <stop offset="100%" stop-color="#3e444d"/>
    </linearGradient>
    <radialGradient id="seal" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#dfe4ea"/>
      <stop offset="100%" stop-color="#5a626e"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow"><stop offset="0%" stop-color="#000" stop-opacity="0.35"/><stop offset="100%" stop-color="#000" stop-opacity="0"/></radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>
  <ellipse cx="240" cy="330" rx="110" ry="12" fill="url(#shadow)"/>

  <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#face)"/>
  <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#glare)"/>

  <!-- top M seal medallion -->
  <circle cx="240" cy="82" r="28" fill="url(#seal)"/>
  <circle cx="240" cy="82" r="28" fill="none" stroke="#3e444d" stroke-width="1" opacity="0.5"/>
  <g fill="#3e444d" opacity="0.9" transform="translate(240 82)">
    <path d="M-13 10 L-13 -12 L-8 -12 L0 3 L8 -12 L13 -12 L13 10 L8 10 L8 -3 L1 10 L-1 10 L-8 -3 L-8 10 Z"/>
    <rect x="-13" y="12" width="26" height="1.6" rx="0.8"/>
  </g>

  <g font-family="Georgia, serif" fill="#3e444d" opacity="0.9">
    <text x="240" y="150" font-size="26" font-weight="700" text-anchor="middle">1000 g</text>
    <text x="240" y="178" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1.5">999 FINE SILVER</text>
  </g>

  <rect x="212" y="196" width="56" height="26" rx="3" fill="none" stroke="#3e444d" stroke-width="1.4" opacity="0.85"/>
  <text x="240" y="215" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#3e444d" text-anchor="middle" opacity="0.9">AG</text>

  <rect x="192" y="234" width="96" height="24" rx="3" fill="none" stroke="#3e444d" stroke-width="1.2" opacity="0.85"/>
  <text x="240" y="252" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#3e444d" text-anchor="middle" opacity="0.9" letter-spacing="2">MARMARA</text>

  <text x="240" y="286" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#3e444d" text-anchor="middle" opacity="0.75" letter-spacing="1.5">SN 2026-101</text>
</svg>
