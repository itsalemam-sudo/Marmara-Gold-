<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f2e6"/>
      <stop offset="100%" stop-color="#efe7d5"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#f8e59a"/>
      <stop offset="35%" stop-color="#e6c565"/>
      <stop offset="72%" stop-color="#b98d2a"/>
      <stop offset="100%" stop-color="#7a5a15"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f4d488"/>
      <stop offset="100%" stop-color="#8a6417"/>
    </linearGradient>
    <radialGradient id="indent" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#5a3f13"/>
      <stop offset="70%" stop-color="#8a6417"/>
      <stop offset="100%" stop-color="#d4a745"/>
    </radialGradient>
    <linearGradient id="glare" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="shadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"  stop-color="#000" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="480" height="360" fill="url(#bg)"/>

  <!-- contact shadow -->
  <ellipse cx="240" cy="330" rx="110" ry="12" fill="url(#shadow)"/>

  <!-- bar body -->
  <g>
    <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#face)"/>
    <!-- highlight edge -->
    <rect x="170" y="30" width="140" height="288" rx="12" fill="url(#glare)"/>
    <!-- top rim highlight -->
    <path d="M170 42 Q240 22 310 42 L310 60 Q240 45 170 60 Z" fill="#fff5c9" opacity="0.35"/>

    <!-- top circle indent (seal) -->
    <circle cx="240" cy="82" r="24" fill="url(#indent)"/>
    <circle cx="240" cy="82" r="24" fill="none" stroke="#4a3410" stroke-width="1" opacity="0.5"/>

    <!-- engraved text -->
    <g font-family="Georgia, 'Times New Roman', serif" fill="#5a3f13" opacity="0.9">
      <text x="240" y="150" font-size="26" font-weight="700" text-anchor="middle">1000 g</text>
      <text x="240" y="182" font-size="22" font-weight="700" text-anchor="middle">999.9</text>
    </g>

    <!-- AU box -->
    <rect x="212" y="196" width="56" height="26" rx="3" fill="none" stroke="#5a3f13" stroke-width="1.4" opacity="0.85"/>
    <text x="240" y="215" font-family="Georgia, serif" font-size="17" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.9">AU</text>

    <!-- MARMARA box -->
    <rect x="192" y="234" width="96" height="24" rx="3" fill="none" stroke="#5a3f13" stroke-width="1.2" opacity="0.85"/>
    <text x="240" y="252" font-family="Georgia, serif" font-size="13" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.9" letter-spacing="2">MARMARA</text>

    <!-- serial -->
    <text x="240" y="286" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#5a3f13" text-anchor="middle" opacity="0.75" letter-spacing="1.5">SN 2026-001</text>
  </g>
</svg>
