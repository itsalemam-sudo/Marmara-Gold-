<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 220" role="img" aria-label="Marmara Precious Metals Group mark">
  <title>Marmara Precious Metals Group</title>
  <defs>
    <linearGradient id="mm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#c8a76a"/>
      <stop offset="45%"  stop-color="#a5854f"/>
      <stop offset="100%" stop-color="#8b6f3d"/>
    </linearGradient>
  </defs>

  <g fill="url(#mm-gold)">

    <!-- Diamond finial at top -->
    <path d="M120 12 L128 26 L120 42 L112 26 Z"/>

    <!-- Left wing (curved flare sweeping from the finial down to the M) -->
    <path d="M118 42
             C 104 52, 90 68, 78 96
             L 78 210
             L 90 210
             L 90 106
             C 100 82, 110 66, 118 56
             Z"/>

    <!-- Right wing (mirror) -->
    <path d="M122 42
             C 136 52, 150 68, 162 96
             L 162 210
             L 150 210
             L 150 106
             C 140 82, 130 66, 122 56
             Z"/>

    <!-- Inner short pillar — left -->
    <path d="M100 96 L108 96 L108 200 L100 200 Z"/>

    <!-- Inner short pillar — right -->
    <path d="M132 96 L140 96 L140 200 L132 200 Z"/>

    <!-- Central downward V (the notch of the M) -->
    <path d="M108 96
             L 120 148
             L 132 96
             L 126 96
             L 120 128
             L 114 96
             Z"/>

    <!-- Left pedestal foot -->
    <path d="M70 208 L98 208 L98 214 L70 214 Z"/>

    <!-- Right pedestal foot -->
    <path d="M142 208 L170 208 L170 214 L142 214 Z"/>

  </g>
</svg>
