<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Marmara Precious Metals Group mark">
  <title>Marmara Precious Metals Group</title>
  <defs>
    <linearGradient id="mm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#cfaa6b"/>
      <stop offset="45%"  stop-color="#a5854f"/>
      <stop offset="100%" stop-color="#8b6f3d"/>
    </linearGradient>
  </defs>

  <g fill="url(#mm-gold)">

    <!-- Diamond finial -->
    <path d="M120 12 L129 30 L120 50 L111 30 Z"/>

    <!-- LEFT crown wing — flares out then sweeps down. Two sub-paths
         give the tapered inner + outer edges. -->
    <path d="M117 50
             C 106 60, 90 74, 80 96
             C 76 104, 74 112, 72 120
             L 82 118
             C 84 112, 87 104, 92 96
             C 100 82, 110 70, 118 62
             Z"/>
    <path d="M72 120
             L 72 224
             L 84 224
             L 84 128
             C 84 124, 84 121, 82 118
             Z"/>

    <!-- RIGHT crown wing (mirror) -->
    <path d="M123 50
             C 134 60, 150 74, 160 96
             C 164 104, 166 112, 168 120
             L 158 118
             C 156 112, 153 104, 148 96
             C 140 82, 130 70, 122 62
             Z"/>
    <path d="M168 120
             L 168 224
             L 156 224
             L 156 128
             C 156 124, 156 121, 158 118
             Z"/>

    <!-- Central V (the notch of the M) — pointed downward -->
    <path d="M96 100
             L 120 168
             L 144 100
             L 136 100
             L 120 148
             L 104 100
             Z"/>

    <!-- Inner LEFT short pillar -->
    <path d="M96 100 L 106 100 L 106 214 L 96 214 Z"/>

    <!-- Inner RIGHT short pillar -->
    <path d="M134 100 L 144 100 L 144 214 L 134 214 Z"/>

    <!-- Pedestal feet — outer wings -->
    <path d="M62 222 L 92 222 L 92 228 L 62 228 Z"/>
    <path d="M148 222 L 178 222 L 178 228 L 148 228 Z"/>

  </g>
</svg>
